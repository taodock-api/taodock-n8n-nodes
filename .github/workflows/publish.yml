name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and pack check only, do not publish)'
        type: boolean
        default: true
      stage_only:
        description: 'Publish to the npm staging area instead of directly (diagnostic)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing requires npm CLI >= 11.5.1 and Node >= 22.14.0.
      # `registry-url` prepares npm for the repository-scoped fallback token used
      # by the publish step while the npm Trusted Publisher record is repaired.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@^11.5.1 && npm --version

      # Defensive: make sure no stale auth entry (empty or real) can shadow OIDC.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      # The repository-scoped granular token is a temporary fallback because npm
      # is not accepting the configured Trusted Publisher for this package yet.
      # GitHub Actions still generates provenance for this public package.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.stage_only == false)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --provenance

      # Staged publishing needs maintainer approval with 2FA before the version
      # goes live. Useful when direct publishing is not allowed for the token.
      - name: Publish to npm staging area
        if: github.event_name == 'workflow_dispatch' && inputs.stage_only
        run: npm stage publish --ignore-scripts --provenance

      # `npm publish --dry-run` still validates the version against the registry,
      # so it fails once the current version is already published. `npm pack
      # --dry-run` gives the same tarball preview with no registry access.
      - name: Dry run pack
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run
