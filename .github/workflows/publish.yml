name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and pack check only, do not publish)'
        type: boolean
        default: true
      stage_only:
        description: 'Publish to the npm staging area instead of directly (diagnostic)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing requires npm CLI >= 11.5.1 and Node >= 22.14.0.
      # No package-manager cache on release builds (npm trusted publishing guidance).
      # Deliberately NO `registry-url`: setup-node would write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}`, which resolves to an empty token and is
      # sent in preference to OIDC (registry answers 401/404 instead of using the
      # trusted publisher). OIDC needs no registry auth entry at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@^11.5.1 && npm --version

      # Defensive: make sure no stale auth entry (empty or real) can shadow OIDC.
      - name: Ensure no registry credential is configured
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete //registry.npmjs.org/:_auth || true
          if [ -n "$NODE_AUTH_TOKEN" ]; then echo "NODE_AUTH_TOKEN must not be set for OIDC publishing" >&2; exit 1; fi
          echo "npm: $(npm --version)"
          echo "node: $(node --version)"
          echo "OIDC request url present: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "OIDC request token present: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          echo "--- npm config (auth keys) ---"
          npm config list | grep -iE "auth|registry|provenance" || echo "(none)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      # Auth comes from OIDC (Trusted Publisher configured on npmjs.com for this
      # repo + this workflow filename). Do NOT set NODE_AUTH_TOKEN here: a token
      # would take precedence and defeat the purpose. Provenance is generated
      # automatically for public packages built from public repos via OIDC.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.stage_only == false)
        run: npm publish --ignore-scripts --provenance
        env:
          NPM_CONFIG_LOGLEVEL: verbose

      # Staged publishing needs maintainer approval with 2FA before the version
      # goes live. Useful when direct publishing is not allowed for the token.
      - name: Publish to npm staging area
        if: github.event_name == 'workflow_dispatch' && inputs.stage_only
        run: npm stage publish --ignore-scripts --provenance

      # `npm publish --dry-run` still validates the version against the registry,
      # so it fails once the current version is already published. `npm pack
      # --dry-run` gives the same tarball preview with no registry access.
      - name: Dry run pack
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run
